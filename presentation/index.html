<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11131a">
<title>AwareCarriage — Presentation</title>
<style>
:root{color-scheme:dark;--bg:#11131a;--panel:#1c1f28;--muted:#a8adba;--accent:#3154e8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}.shell{height:100%;display:grid;grid-template-rows:minmax(0,1fr) 58px;place-items:center;padding:18px 24px 8px}.canvas{position:relative;width:min(100%,calc((100vh - 94px)*2.11702));aspect-ratio:651.27/307.64;background:#e9edf5;overflow:hidden;box-shadow:0 20px 70px #0008}.slide{position:absolute;inset:0;width:100%;height:100%;display:none}.slide.active{display:block}.slide>img{width:100%;height:100%;object-fit:fill;display:block}.slide video{display:block;position:absolute;z-index:2;background:#111;object-fit:cover}.slide iframe{position:absolute;z-index:3;border:0;background:#f5f6f8}.controls{width:min(100%,calc((100vh - 94px)*2.11702));height:50px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--panel);border:1px solid #ffffff12;border-radius:14px;padding:0 14px}.control-group{display:flex;align-items:center;gap:10px}.controls button{border:0;border-radius:9px;background:#2b2f3b;color:#fff;padding:8px 13px;font-size:14px;cursor:pointer}.controls button:hover{background:#3a4153}.counter{min-width:62px;text-align:center;font-variant-numeric:tabular-nums;color:#e8eaf0;font-size:13px}.dots{display:flex;align-items:center;gap:5px;max-width:48vw;overflow:auto;scrollbar-width:none}.dots button{width:7px;height:7px;flex:0 0 7px;padding:0;border-radius:50%;background:#747a88}.dots button.active{background:#fff;transform:scale(1.35)}@media(max-width:700px){.shell{padding:8px 8px 4px;grid-template-rows:minmax(0,1fr) 52px}.canvas{width:min(100%,calc((100vh - 70px)*2.11702))}.controls{height:46px;padding:0 8px;gap:6px}.controls button{padding:8px 10px}.dots{max-width:40vw}}
</style>
</head>
<body><main class="shell"><section class="canvas" id="canvas" aria-label="Presentation slides"></section><nav class="controls" aria-label="Slide controls"><div class="control-group"><button id="prev" aria-label="Previous slide">←</button><span class="counter" id="counter"></span><button id="next" aria-label="Next slide">→</button></div><div class="dots" id="dots"></div><button id="fullscreen">⛶</button></nav></main>
<script>
const total=23, canvas=document.getElementById('canvas'), dots=document.getElementById('dots');let current=1;
for(let n=1;n<=total;n++){const s=document.createElement('article');s.className='slide'+(n===1?' active':'');s.dataset.page=n;const img=document.createElement('img');img.src=`assets/slides/slide-${String(n).padStart(2,'0')}.jpg`;img.alt='';s.appendChild(img);
if(n===19){const v=document.createElement('video');v.dataset.chunks='assets/video-chunks/scent-01.b64,assets/video-chunks/scent-02.b64,assets/video-chunks/scent-03.b64,assets/video-chunks/scent-04.b64,assets/video-chunks/scent-05.b64';v.controls=true;v.playsInline=true;v.preload='metadata';v.style.cssText='left:11.25%;top:3.7%;width:77.9%;height:92.6%';s.appendChild(v)}
if(n===21){const f=document.createElement('iframe');f.src='assets/awarecarriage-app-embed.html';f.title='Interactive AwareCarriage app';f.allow='fullscreen';f.style.cssText='left:36.6%;top:3.8%;width:60%;height:88.6%';s.appendChild(f)}
if(n===22){const f=document.createElement('iframe');f.src='assets/dashboard/index.html';f.title='Interactive AwareCarriage staff dashboard';f.allow='fullscreen';f.style.cssText='inset:0;width:100%;height:100%';s.appendChild(f)}
if(n===23){const v=document.createElement('video');v.dataset.chunks='assets/video-chunks/system-final-01.b64,assets/video-chunks/system-final-02.b64,assets/video-chunks/system-final-03.b64,assets/video-chunks/system-final-04.b64,assets/video-chunks/system-final-05.b64,assets/video-chunks/system-final-06.b64,assets/video-chunks/system-final-07.b64,assets/video-chunks/system-final-08.b64,assets/video-chunks/system-final-09.b64,assets/video-chunks/system-final-10.b64,assets/video-chunks/system-final-11.b64,assets/video-chunks/system-final-12.b64,assets/video-chunks/system-final-13.b64,assets/video-chunks/system-final-14.b64,assets/video-chunks/system-final-15.b64,assets/video-chunks/system-final-16.b64,assets/video-chunks/system-final-17.b64,assets/video-chunks/system-final-18.b64,assets/video-chunks/system-final-19.b64,assets/video-chunks/system-final-20.b64,assets/video-chunks/system-final-21.b64,assets/video-chunks/system-final-22.b64,assets/video-chunks/system-final-23.b64,assets/video-chunks/system-final-24.b64,assets/video-chunks/system-final-25.b64,assets/video-chunks/system-final-26.b64,assets/video-chunks/system-final-27.b64,assets/video-chunks/system-final-28.b64,assets/video-chunks/system-final-29.b64,assets/video-chunks/system-final-30.b64,assets/video-chunks/system-final-31.b64,assets/video-chunks/system-final-32.b64,assets/video-chunks/system-final-33.b64,assets/video-chunks/system-final-34.b64,assets/video-chunks/system-final-35.b64,assets/video-chunks/system-final-36.b64,assets/video-chunks/system-final-37.b64,assets/video-chunks/system-final-38.b64,assets/video-chunks/system-final-39.b64,assets/video-chunks/system-final-40.b64,assets/video-chunks/system-final-41.b64,assets/video-chunks/system-final-42.b64,assets/video-chunks/system-final-43.b64,assets/video-chunks/system-final-44.b64,assets/video-chunks/system-final-45.b64,assets/video-chunks/system-final-46.b64,assets/video-chunks/system-final-47.b64';v.controls=true;v.playsInline=true;v.preload='metadata';v.style.cssText='inset:0;width:100%;height:100%;object-fit:contain;background:#080808';s.appendChild(v)}
canvas.appendChild(s);const d=document.createElement('button');d.setAttribute('aria-label',`Slide ${n}`);d.addEventListener('click',()=>show(n));dots.appendChild(d)}
function show(n){current=Math.max(1,Math.min(total,n));document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===current-1));const activeVideo=document.querySelector('.slide.active video[data-chunks]');if(activeVideo&&!activeVideo.dataset.ready){activeVideo.dataset.ready='1';Promise.all(activeVideo.dataset.chunks.split(',').map(p=>fetch(p).then(r=>{if(!r.ok)throw Error('Video part missing');return r.text()}))).then(parts=>{const raw=atob(parts.join(''));const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);activeVideo.src=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}))}).catch(()=>{activeVideo.dataset.ready=''})}[...dots.children].forEach((el,i)=>el.classList.toggle('active',i===current-1));document.getElementById('counter').textContent=`${current} / ${total}`;}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(1);if(e.key==='End')show(total)});let startX=0;canvas.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});canvas.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-startX;if(Math.abs(d)>70)show(current+(d<0?1:-1))},{passive:true});show(1);
</script></body></html>
